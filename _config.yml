# Basic Site Settings
locale                   : "en-US"
site_theme               : "dark"
title                    : "Junyi Zhao"
title_separator          : "-"
name                     : &name "Junyi Zhao"
description              : &description "Personal academic website of Junyi Zhao"
url                      : "https://junyizhaoastro.github.io"
baseurl                  : ""
repository               : "JunyiZhaoAstro/JunyiZhaoAstro.github.io"

# Site Author
author:
  avatar           : "Head_sq.jpg"
  name             : "Junyi Zhao"
  pronouns         : "he/him"
  bio              : "Ph.D. Student | Lunar & Planetary Science"
  location         : "Hong Kong SAR"
  employer         : "The University of Hong Kong"
  email            : "u3014801@connect.hku.hk"
  orcid            : "https://orcid.org/0009-0007-8418-5477"
  github           : "JunyiZhaoAstro"
  linkedin         : "junyi-zhao-5a7131331"

publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : false
  path                   :

# SEO
og_image                 :
og_description           :
social:
  type                   : Person
  name                   : "Junyi Zhao"
  links:

# Analytics
analytics:
  provider               : "false"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections currently used by the site
collections:
  talks:
    output: true
    permalink: /:collection/:path/

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
